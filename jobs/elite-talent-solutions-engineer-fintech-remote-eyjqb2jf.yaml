description: "About our clientOur client is an AI powered risk screening and monitoring\
  \ platform helping teams identify, screen, and monitor financial crime risk across\
  \ client relationships. They are coming off 2 consecutive years of record growth,\
  \ recently raised a Series B, and are expanding and growing.\n\nThis is an early,\
  \ high impact seat with real traction behind the product and go to market engine.\n\
  \nWhy this role existsThis is the first dedicated Solutions Engineer hire. Up to\
  \ now, the function has been owned by leadership, and it’s time to add a founding\
  \ SE who can own the pre-sales engine and scale it.\n\nWhat you will doPartner with\
  \ AEs mid-funnel to move deals from qualification through close\n\nDeliver high\
  \ volume prospect sessions and demos, \n\nOwn the demo environment, demo flow, and\
  \ supporting materials\n\nHandle RFIs and RFPs and drive crisp, high quality written\
  \ responses\n\nSupport pricing and proposal creation and help multithread across\
  \ stakeholders\n\nRun technical and operational sessions, including solutioning\
  \ and light POC support when needed\n\nLiaise between Sales, Product, and delivery\
  \ teams to keep deals moving\n\nIdentify product gaps, create structured gap lists,\
  \ and feed insights back to Product\n\nWhat we are looking for2 to 5 years in a\
  \ Solutions Engineer or Sales Engineer seat (pre sales)\n\nComfortable being customer\
  \ facing daily \n\nStrong written communication for RFIs, RFPs, and proposal support\n\
  \nTechnical fluency to speak credibly about: SQL, APIs and integrations, Python\
  \ (literacy, not deep engineering)\n\nExperience supporting mid market buyers with\
  \ multiple stakeholders\n\nStartup mindset: autonomous, organized, able to build\
  \ while executing\n\nFintech, regtech, risk, KYC, KYB, AML, sanctions screening,\
  \ adverse media, or compliance exposure\n\nWork model and locationUS based, remote\
  \ (work East Coast hours)\n\nCompensation\n\nTarget OTE: up to $180,000\n\nEmployment\
  \ Type: FULL_TIME"
