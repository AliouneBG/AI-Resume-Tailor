title: AI/ML Solution Engineer
company: Snowflake
location: Anywhere
remote: true
description: 'Snowflake is about empowering enterprises to achieve their full potential
  — and people too. With a culture that’s all in on impact, innovation, and collaboration,
  Snowflake is the sweet spot for building big, moving fast, and taking technology
  — and careers — to the next level.


  Snowflake is about empowering enterprises to achieve their full potential — and
  people too. With a culture that’s all in on impact, innovation, and collaboration,
  Snowflake is the sweet spot for building big, moving fast, and taking technology
  — and careers — to the next level.


  Our Solution Engineering organization is seeking an AI/ML specialist to join our
  Solutions Engineering team, while supporting our Retail & Consumer Goods sector.
  We are looking for a Snowflake expert who can provide AI/ML technical guidance,
  while working with both technical and business executives in the design and architecture
  of the Snowflake Cloud Data Platform as a critical component of their enterprise
  data architecture and overall ecosystem. In this role you will work directly with
  the sales team to understand the AI/ML needs of our customers, strategize on how
  to navigate winning sales cycles, provide compelling value-based demonstrations,
  support enterprise Proof of Concepts, and ultimately close business. You will leverage
  your technical expertise, best practices and reference architectures highlighting
  Snowflake’s Data Platform capabilities across data ingestion, transformation, and
  lakehouse workloads. You are equally comfortable in both a business and technical
  context, interacting with executives and talking shop with technical audiences.


  IN THIS ROLE YOU WILL GET TO:Apply your multi-cloud data architecture expertise
  while presenting Snowflake technology and vision to executives and technical contributors
  at strategic prospects, customers, and partners


  Work hands-on with prospects and customers to demonstrate and communicate the value
  of Snowflake technology throughout the sales cycle, from demo to proof of concept
  to design and implementation


  Immerse yourself in the ever-evolving industry, maintaining a deep understanding
  of competitive and complementary technologies and vendors and how to position Snowflake
  in relation to them


  Collaborate with Product Management, Engineering, and Marketing to continuously
  improve Snowflake’s products and marketing


  ON DAY ONE, WE WILL EXPECT YOU TO HAVE:5+ years of data engineering experience within
  the Enterprise Data space with a strong preference for candidates possessing deep,
  hands-on Snowflake architecture experience.


  3+ years experience working with AI/ML technologies


  Outstanding presentation skills to both technical and executive audiences, whether
  impromptu on a whiteboard or using presentations and demos.


  Ability to connect a customer’s specific business problems and Snowflake’s solutions


  Ability to do deep discovery of customer’s architecture framework and connect those
  with Snowflake Data Architecture.


  Broad range of experience within large-scale Database and/or Data Warehouse technology,
  ETL, analytics and cloud technologies. For example, Data Lake, Data Mesh, Data Fabric


  Hands on Development experience with technologies such as SQL, Python, Pandas, Spark,
  PySpark, Hadoop, Hive and any other Big data technologies


  Deep understanding of data integration services and tools for building ETL and ELT
  data pipelines such as Apache NiFi, Matillion, Fivetran, Qlik, or Informatica.


  Familiarity with streaming technologies (ex. Kafka, Flink, Spark Streaming, Kinesis)
  and real-time or near real time use cases (ex. CDC)


  Experience designing interoperable data lakehouse architectures and experience working
  with Iceberg, Delta, and Parquet


  Strong architectural expertise in data engineering to confidently present and demo
  to business executives and technical audiences, and effectively handle any impromptu
  questions


  Bachelor’s Degree required, computer science, engineering, mathematics or related
  fields, or equivalent experience preferred


  Every Snowflake employee is expected to follow the company’s confidentiality and
  security standards for handling sensitive data. Snowflake employees must abide by
  the company’s data security plan as an essential part of their duties. It is every
  employee''s duty to keep customer information secure and confidential.




  Snowflake is growing fast, and we’re scaling our team to help enable and accelerate
  our growth. We are looking for people who share our values, challenge ordinary thinking,
  and push the pace of innovation while building a future for themselves and Snowflake.


  How do you want to make your impact?


  For jobs located in the United States, please visit the job posting on the Snowflake
  Careers Site for salary and benefits information: careers.snowflake.com


  The following represents the expected range of compensation for this role:


  This role is eligible to participate in Snowflake''s commission plan and it is common
  for employees in this role to receive total on-target earnings of $184,000 - $241,500.
  The estimated base salary for this role is $138,000 - $181,125.Additionally, this
  role is eligible to participate in Snowflake’s equity plan.The successful candidate’s
  starting salary will be determined based on permissible, non-discriminatory factors
  such as skills, experience, and geographic location. This role is also eligible
  for a competitive benefits package that includes: medical, dental, vision, life,
  and disability insurance; 401(k) retirement plan; flexible spending & health savings
  account; at least 12 paid holidays; paid time off; parental leave; employee assistance
  program; and other company benefits.


  To comply with pay transparency requirements and other statutes, you can notify
  us if you believe that a job posting is not compliant by completing this form.'
