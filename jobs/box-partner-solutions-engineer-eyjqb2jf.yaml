title: Partner Solutions Engineer
company: Box
location: New York, NY (+3 others)
remote: false
description: "WHAT IS BOX? \n\n Box (NYSE:BOX) is the leader in Intelligent Content\
  \ Management. Our platform enables organizations to fuel collaboration, manage the\
  \ entire content lifecycle, secure critical content, and transform business workflows\
  \ with enterprise AI. We help companies thrive in the new AI-first era of business.\
  \ Founded in 2005, Box simplifies work for leading global organizations, including\
  \ JLL, Morgan Stanley, and Nationwide. Box is headquartered in Redwood City, CA,\
  \ with offices across the United States, Europe, and Asia.\n\n By joining Box, you\
  \ will have the unique opportunity to continue driving our platform forward. Content\
  \ powers how we work. It’s the billions of files and information flowing across\
  \ teams, departments, and key business processes every single day: contracts, invoices,\
  \ employee records, financials, product specs, marketing assets, and more. Our mission\
  \ is to bring intelligence to the world of content management and empower our customers\
  \ to completely transform workflows across their organizations. With the combination\
  \ of AI and enterprise content, the opportunity has never been greater to transform\
  \ how the world works together and at Box you will be on the front lines of this\
  \ massive shift.\n\n WHY BOX NEEDS YOU\n\n The Channel Solutions Engineer (Channel\
  \ SE) plays a critical role in expanding our reach through the partner ecosystem.\
  \ This role works directly with channel partners to design solutions, evangelize\
  \ the platform, and build technical capability within the partner community. Channel\
  \ SEs bring the same technical depth, solutioning expertise, and customer-centric\
  \ mindset that field Solutions Engineers bring to direct accounts, but apply these\
  \ skills through the lens of partner success and scale. By empowering partners to\
  \ effectively position and deliver the company’s solutions, Channel SEs help accelerate\
  \ joint growth and drive customer impact.\n\n WHAT YOU’LL DO\n\n   Research, explore\
  \ and identify customer business problems; you’ll think like a builder and experiment,\
  \ iterate, and refine to make every customer experience exceptional\n\n   Joint\
  \ Solutioning: Collaborate with partner technical teams to design architectures\
  \ and demos tailored to end-customer needs, with the sole focus on the partner business\n\
  \n   Solution Evangelism: Act as a trusted technical advocate for the Box platform\
  \ within the partner community, showcasing how our solutions solve real business\
  \ problems across industries\n\n   Ecosystem Development: Help identify and develop\
  \ new technical use cases and solution accelerators that can be leveraged by partners\
  \ to increase pipeline velocity\n\n   Partner Enablement: Deliver technical training,\
  \ workshops, and certifications to help partners understand the platform, positioning,\
  \ and best practices for building and selling solutions\n\n   Co-Selling Support:\
  \ Participate in partner-led customer engagements supporting discovery, demos, and\
  \ proof-of-concepts where technical alignment is key to winning deals\n\n   Partner\
  \ Feedback Loop: Provide structured feedback to product, marketing, and sales teams\
  \ based on partner and customer insights to influence roadmap and go-to-market strategy\n\
  \n   Travel up to 50% of the time\n\n   WHO YOU ARE \n\n We are an AI-first company.\
  \ This means you approach your work with a growth mindset and find ways to leverage\
  \ AI to help make faster, smarter decisions that will 10X your impact at Box.\n\n\
  \   3+ years of experience in Solutions Engineering, Pre-Sales, or Partner Technical\
  \ Enablement within a SaaS or enterprise software environment\n\n   Strong understanding\
  \ of working within highly regulated industries\n\n   Experience working with or\
  \ within a channel, VAR, or system integrator ecosystem\n\n   Strong technical depth\
  \ across AI, Business Process, Content Management, or similar\n\n   Strong communication\
  \ and presentation skills, with the ability to establish trust across a range of\
  \ technical and non-technical audiences; passionate about showing, not just telling\
  \ and designing demos and narratives that make the power of Box tangible\n\n   Ability\
  \ to balance strategic enablement initiatives with tactical deal support responsibilities\n\
  \n   Collaborative mindset with a passion for teaching, scaling knowledge, and building\
  \ technical communities\n\n   Creative when solving a customer's business problem;\
  \ you experiment, iterate, and refine to make every customer experience exceptional\n\
  \n   Box lives its values, with community and in-person collaboration being a core\
  \ part of our culture. Boxers are expected to work from their assigned office a\
  \ minimum of 3 days per week.Your Recruiter will share more about how we work and\
  \ company culture during the hiring process.\n\n At Box, we believe unique and diverse\
  \ experiences benefit our culture, our products, our customers, our company, and\
  \ our world. We aim to recruit a passionate, high-performing workforce that reflects\
  \ the world we live in. If you are head-over-heels about this role but unsure if\
  \ you meet all the requirements, we encourage you to apply!\n\n EQUAL OPPORTUNITY\n\
  \n We are an equal opportunity employer and value diversity at our company. We do\
  \ not discriminate on the basis of race, religion, color, national origin, gender,\
  \ sexual orientation, age, marital status, veteran status, disability, and any other\
  \ protected ground of discrimination under applicable human rights legislation.\
  \ Box strives to respect the dignity and ‎‎independence of people with disabilities\
  \ and is committed to giving them the same ‎‎opportunity to succeed as all other\
  \ employees. Inclusiveness is core to our culture at Box, and we strive to ensure\
  \ you get the most from your interview experience.\n\n Box makes reasonable accommodations\
  \ for applicants with disabilities. If a reasonable accommodation is needed to participate\
  \ in the job application or interview process, please complete this form. Reasonable\
  \ accommodations may include scheduling adjustments, document dictation and beyond.\n\
  \n Notice to applicants in Los Angeles:  Box, Inc and its related branches will\
  \ consider for employment, qualified applicants with criminal histories in a manner\
  \ consistent with the Los Angeles Fair Chair Ordinance.  The Fair Chance Ordinance\
  \ is provided here. \n\n Notice to applicants in San Francisco:  Box, Inc and its\
  \ related branches will consider for employment, qualified applicants with criminal\
  \ histories in a manner consistent with the San Francisco Fair Chair Ordinance.\
  \  The Fair Chance Ordinance is provided here. \n\n For details on how we protect\
  \ your information when you apply, please see our Personnel Privacy Notice. If you\
  \ are a California-resident, please read our California Applicant & Candidate Privacy\
  \ Notice here.\n\n Box is committed to fair and equitable compensation practices.\
  \ Actual base salary (or OTE if commissionable role) is dependent upon factors such\
  \ as: knowledge, skill level, experience, and work location. This role is also eligible\
  \ for equity and benefits. For more information on benefits, check out our healthcare\
  \ benefits and additional Box Benefits + Perks.  In accordance with OFCCP compliance,\
  \ here is the Pay Transparency Provision. \n\n #LI-KG3\n\n Box is committed to fair\
  \ and equitable compensation practices. Actual base salary (or OTE if commissionable\
  \ role) is dependent upon factors such as: knowledge, skill level, experience, and\
  \ work location. This role is also eligible for equity and benefits. For more information\
  \ on benefits, check out our healthcare benefits and additional Box Benefits + Perks.\n\
  \n In accordance with OFCCP compliance, here is the Pay Transparency Provision.\
  \ \n\nUnited States Pay Range\n\n$155,500—$194,500 USD"
