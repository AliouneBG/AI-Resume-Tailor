title: Solutions Engineer - Commercial & Bilingual (French/English)
company: Talkdesk
location: New York, NY
remote: false
description: "Conducts research to prepare for upcoming meetings with prospects to\
  \ understand their business environment, market, customers, competitors and general\
  \ business challenges.Carries out discovery conversations with customers to understand\
  \ their needs and requirements for a new solution. Uncovers customer pains, learns\
  \ about customer's objectives and potential needs, gathers metrics necessary for\
  \ pricing and/or value discussions. Listens to the customer to gather information\
  \ that can be leveraged in upcoming presentations.Uses their in-depth knowledge\
  \ of Talkdesk solutions and capabilities to specify the appropriate solution(s)\
  \ for customer needs and requirements. The SE is continually learning about Talkdesk\
  \ solutions to keep up with innovations and new releases of TD software.Designs\
  \ and delivers presentations to customers, on-site & virtual, showing Talkdesk's\
  \ capabilities, aligned to the customer's pains and needs that were uncovered during\
  \ Discovery.Generates simple value statements illustrating the financial value of\
  \ a Talkdesk solution to customers.Assists with scoping SOWs for customer implementations\
  \ as needed.Scopes, executes and manages customer pilots and POCs. Respond to functional\
  \ and technical RFI/RFP requirements and mapping said requirements to the software\
  \ solution.Work closely with product management and engineering teams to ensure\
  \ that customer feedback is incorporated into product roadmaps.Assists with marketing\
  \ and demand generation events as necessary.Core Background\n\nB.S. Computer Science,\
  \ Software Engineering, MIS or equivalent work experience.3-5 years as a Solutions\
  \ Engineer in Software, VOIP/Telecommunications, contact centers, premise or cloud\
  \ selling to Commercial or Enterprise customers.Bilingual in French Ability to command\
  \ the attention in a room by delivering compelling presentations and demonstrations.Good\
  \ problem solving skills, including the ability to meet a business requirement with\
  \ a technical solution.Ability to communicate complex technical concepts to both\
  \ technical and non-technical audiences.Excellent presentation and communication\
  \ skills, including the ability to lead technical discussions and demonstrations\
  \ with customers.Knowledge of Customer Relationship Management Software, ITSM, Data\
  \ Warehousing, Business Intelligence is a plus.Knowledge of UCaaS, CCaaS software\
  \ is a plus.Knowledge in web / scripting technologies is a plusPay Range (OTE):\
  \ $205,000 - $245,000\n\nOther Types of Pay: Based on level and role the employee\
  \ may be eligible for long term incentives in the form of equity and short term\
  \ incentives of either bonus or commission. \n\nHealth Insurance: Medical, Dental,\
  \ Vision, Life and Disability Insurance, Employee Assistance Program (EAP).\n\n\
  Retirement Benefits: 401(k) plan\n\nPaid Time Off: Talkdesk offers an uncapped paid\
  \ time off program, subject to manager approval and consistent with business needs.\
  \ \n\nPaid Holidays: Talkdesk offers 14 paid holidays each year. \n\nPaid Sick Leave:\
  \ Employees have uncapped paid time off, subject to manager approval and consistent\
  \ with business needs. \n\nMethod of Application: Apply online.\n\nApplication Window:\
  \ The application window is expected to close at least 5 days from the posting date.\
  \ The application was posted on 01/26/2026.\n\nAll questions or concerns about this\
  \ posting should be directed to the Talent team at Talent@talkdesk.com."
