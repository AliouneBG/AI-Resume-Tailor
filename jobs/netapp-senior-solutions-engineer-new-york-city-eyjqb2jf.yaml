title: Senior Solutions Engineer - New York City
company: NetApp
location: New York, NY
remote: false
description: "LOCATIONThis Senior Solutions Engineer will be mapped to Enterprise\
  \ Client Executive(s) that currently reside in the greater NYC area, supporting\
  \ customers and partners in territory. While this is not an in office role, frequent\
  \ travel within the region is required. Therefore, to be considered, you gotta be\
  \ based in or around the big apple (New York). \n\nJOB SUMMARYWe’re looking for\
  \ a Senior Solutions Engineer to support our Enterprise Sales organization across\
  \ the New York City region. In this role, you’ll partner with Enterprise Client\
  \ Executives to deliver strategic, data-driven solutions for customers and partners.\
  \ You’ll help customers modernize and optimize their on-prem and hybrid environments,\
  \ enabling smarter data management, AI readiness, and disaster recovery resilience.\
  \ This is a hands-on technical role that blends relationship-building, architecture\
  \ design, and business impact, working side-by-side with sales to drive growth across\
  \ both existing and whitespace accounts. \n\nWHAT YOU'LL DO Serve as the technical\
  \ lead and trusted advisor to enterprise customers across the New York territory.\
  \ Partner closely with assigned Enterprise Client Executives to define account strategy,\
  \ drive pipeline development, and support deal progression. Lead technical discovery\
  \ sessions to identify customer challenges and architect end-to-end data storage\
  \ and protection solutions. Design and position solutions leveraging the full NetApp\
  \ portfolio, including ONTAP, SAN, NAS, block and file storage, hybrid cloud, and\
  \ data protection technologies. Support both protect/expand and whitespace opportunities,\
  \ helping your reps hunt for net-new logos while maintaining deep engagement within\
  \ existing accounts. Engage in strategic conversations around data pipelines, disaster\
  \ recovery, data governance, and hybrid architecture best practices. Collaborate\
  \ with product management, engineering, and partner teams to ensure successful execution\
  \ from design to delivery. Stay current on emerging technologies, bringing forward\
  \ new ideas that drive customer innovation and value. QUALIFICATIONS7+ years of\
  \ experience in technical pre-sales, solutions engineering, or systems engineering\
  \ roles. Proven experience supporting enterprise or Fortune 1000 customers, ideally\
  \ within the data storage or infrastructure space. Bachelors Degree, Engineering\
  \ or Related Fields (not required, experience is just as good!)Strong technical\
  \ understanding of on-prem storage technologies (block, file, SAN, NAS) and ecosystem\
  \ components. Familiarity with hybrid cloud architectures, virtualization, and data\
  \ protection/disaster recovery solutions. Excellent communication and presentation\
  \ skills, the ability to translate technical capabilities into business outcomes.\
  \ Based in region; local presence is required to effectively support customers and\
  \ partners in territory.  \n\nCompensation:\nThe target salary range for this position\
  \ is 193,800 - 250,800 USD. The salary offered will be determined by the candidate's\
  \ location, qualifications, experience, and education and may be outside of this\
  \ range. The range is based on 'On Target Earnings’ (OTE) representing the total\
  \ potential earnings, which is the sum of the base salary and potential commission\
  \ earned when performance targets are achieved. Final compensation packages are\
  \ competitive and in line with industry standards, reflecting a variety of factors,\
  \ and include a comprehensive benefits package. This may cover Health Insurance,\
  \ Life Insurance, Retirement or Pension Plans, Paid Time Off, various Leave options,\
  \ employee stock purchase plan, and/or restricted stocks (RSU’s). These offerings\
  \ are subject to regional variations and governed by local laws, regulations, and\
  \ company policies. We will provide detailed information about the specific benefits\
  \ for your region during the recruitment process.\n\nAt NetApp, we embrace a hybrid\
  \ working environment designed to strengthen connection, collaboration, and culture\
  \ for all employees. This means that most roles will have some level of in-office\
  \ and/or in-person expectations, which will be shared during the recruitment process.\
  \ \n\nEqual Opportunity Employer:\n\nNetApp is firmly committed to Equal Employment\
  \ Opportunity (EEO) and to compliance with all federal, state and local laws that\
  \ prohibit employment discrimination based on age, race, color, gender, sexual orientation,\
  \ gender identity, national origin, religion, disability or genetic information,\
  \ pregnancy, protected veteran status, and any other protected classification.\n\
  \nWhy You'll Thrive at NetApp\n\nAt NetApp, you won't wait for the perfect moment—you'll\
  \ make it. The early planning, the extra thought, the bold idea that turns good\
  \ into great: That's how our people operate and how we continue to push the boundaries\
  \ of data infrastructure.\n\nNetApp is the trusted partner for organizations transforming\
  \ data into opportunity. As the only enterprise-grade storage service natively embedded\
  \ in Google Cloud, AWS, and Microsoft Azure, we empower customers to run everything\
  \ from traditional workloads to enterprise AI with unmatched performance, resilience,\
  \ and security.\n\nOur culture\n\nWe celebrate mold breakers, bold thinkers, and\
  \ problem solvers. We reward initiative, impact, and ownership. We provide flexibility\
  \ so you can balance professional ambition with your personal life. Here, differences\
  \ are not just welcomed—they drive everything we do.\n\nIf you're ready to innovate,\
  \ rise to the challenge, and own every moment - make your next move your best one.\
  \ Apply now."
