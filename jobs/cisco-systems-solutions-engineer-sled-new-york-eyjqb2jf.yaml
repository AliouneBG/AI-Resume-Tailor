description: "The application window is expected to close on: 03/27/2026Job posting\
  \ may be removed earlier if the position is filled or if a sufficient number of\
  \ applications are received. \n\n The required location for this role is New York\
  \ City, NY and local candidates will be prioritized. Candidates from Connecticut\
  \ and New Jersey may be considered. Must live in or be willing to relocate to the\
  \ listed area's \n\n Meet the Team \nCisco is looking for Presales Solutions Architect\
  \ / Systems Engineer based in NYC Serving the State and Local Government segment.\
  \ The vision of Cisco’s SLED organization (State, Local Government and Education)\
  \ is to help governments protect, educate, and serve citizens. From classrooms to\
  \ traffic intersections, we connect, secure, and automate critical government and\
  \ educational missions to improve our communities. \n\n Your Impact \nThe Solutions\
  \ Engineer is a customer-focused technical sales professional who provides high-level\
  \ technical guidance and support to customers. You will partner with your Account\
  \ Manager to discover customer priorities and needs, recommend, and develop appropriate\
  \ customer solution offerings, and ensure customer success by leveraging Cisco and\
  \ partner resources. You act in an increasingly consultative fashion and are looked\
  \ to as an expert, or trusted technical adviser, by partners and customers. The\
  \ role of the Solutions Engineer is broad and includes activities such relationship\
  \ building, discovery, as building relationships and discovery across all relevant\
  \ technology teams in a customer, identifying opportunities and defining solution\
  \ options, articulating Cisco’s differentiation and the benefits of proposed solutions,\
  \ developing and executing proof-of-concept/proof-of-value, creating a technical\
  \ account plan while influencing the overall account plan, and advocating for customers\
  \ through adoption and operation of Cisco solutions. \n\n Business Acumen \n\n\n\
  \n Learn a broad level of knowledge of the business economics and trends in the\
  \ SLED market segments and how Cisco solutions add financial and strategic value.\n\
  \ Build relationships both within and outside of Cisco; establish credibility quickly\
  \ through personal self-confidence.\n Strong understanding of the customer business\
  \ model and ability to frame Cisco offerings in terms of business or mission drivers.\
  \ In addition, understand customer drivers and how to map these to a customer network\
  \ platform.\n Technical Acumen \n\n\n\n Understand internetworking industry trends,\
  \ including new products and solutions.\n Understand the competitive product and\
  \ solution landscape.\n Advanced knowledge in Switching, Wireless, Routing, Data\
  \ Centers, Security and Networking Platform Design\n Communication Skills \n\n\n\
  \n The SE role is very dynamic and applies your technical knowledge and curiosity\
  \ to solve complex challenges in complex customer environments.\n Excellent presentation\
  \ skills are needed to describe Cisco's Architectures, Business Outcomes, and Business\
  \ Value in each customer’s context.\n Minimum Qualifications:\n\n\n Located in New\
  \ York City or New York City Metro area with the ability to be onsite as needed\n\
  \ 5+ Cisco product experience or relevant experience in key competitor offerings\
  \ required.\n 5+ Pre-Sales experience required.\n Preferred Qualifications:\n\n\n\
  \ CCNP, CCDP, VCP, or similar vendor certification preferred\n Excellent presentation\
  \ skills – ability to deliver engaging workshops to both technical and non-technical\
  \ audiences on Data Center, Cloud, and/or AI topics\n Why Cisco? \nAt Cisco, we’re\
  \ revolutionizing how data and infrastructure connect and protect organizations\
  \ in the AI era – and beyond. We’ve been innovating fearlessly for 40 years to create\
  \ solutions that power how humans and technology work together across the physical\
  \ and digital worlds. These solutions provide customers with unparalleled security,\
  \ visibility, and insights across the entire digital footprint. Simply put – we\
  \ power the future. \nFueled by the depth and breadth of our technology, we experiment\
  \ and create meaningful solutions. Add to that our worldwide network of doers and\
  \ experts, and you’ll see that the opportunities to grow and build are limitless.\
  \ We work as a team, collaborating with empathy to make really big things happen\
  \ on a global scale. Because our solutions are everywhere, our impact is everywhere.\
  \ We are Cisco, and our power starts with you. \n\n Why Cisco? \n\n At Cisco, we’re\
  \ revolutionizing how data and infrastructure connect and protect organizations\
  \ in the AI era – and beyond. We’ve been innovating fearlessly for 40 years to create\
  \ solutions that power how humans and technology work together across the physical\
  \ and digital worlds. These solutions provide customers with unparalleled security,\
  \ visibility, and insights across the entire digital footprint. \nFueled by the\
  \ depth and breadth of our technology, we experiment and create meaningful solutions.\
  \ Add to that our worldwide network of doers and experts, and you’ll see that the\
  \ opportunities to grow and build are limitless. We work as a team, collaborating\
  \ with empathy to make really big things happen on a global scale. Because our solutions\
  \ are everywhere, our impact is everywhere. \nWe are Cisco, and our power starts\
  \ with you. \n\n Message to applicants applying to work in the U.S. and/or Canada:\
  \ \n\n The starting salary range posted for this position is $223,000.00 to $287,200.00\
  \ and reflects the projected salary range for new hires in this position in U.S.\
  \ and/or Canada locations, not including incentive compensation*, equity, or benefits.\
  \ \nIndividual pay is determined by the candidate's hiring location, market conditions,\
  \ job-related skillset, experience, qualifications, education, certifications, and/or\
  \ training. The full salary range for certain locations is listed below. For locations\
  \ not listed below, the recruiter can share more details about compensation for\
  \ the role in your location during the hiring process. \n\n U.S. employees are offered\
  \ benefits, subject to Cisco’s plan eligibility rules, which include medical, dental\
  \ and vision insurance, a 401(k) plan with a Cisco matching contribution, paid parental\
  \ leave, short and long-term disability coverage, and basic life insurance. Please\
  \ see the Cisco careers site to discover more benefits and perks. Employees may\
  \ be eligible to receive grants of Cisco restricted stock units, which vest following\
  \ continued employment with Cisco for defined periods of time. \n\n U.S. employees\
  \ are eligible for paid time away as described below, subject to Cisco’s policies:\
  \ \n\n\n\n 10 paid holidays per full calendar year, plus 1 floating holiday for\
  \ non-exempt employees\n 1 paid day off for employee’s birthday, paid year-end holiday\
  \ shutdown, and 4 paid days off for personal wellness determined by Cisco\n Non-exempt\
  \ employees** receive 16 days of paid vacation time per full calendar year, accrued\
  \ at rate of 4.92 hours per pay period for full-time employees\n Exempt employees\
  \ participate in Cisco’s flexible vacation time off program, which has no defined\
  \ limit on how much vacation time eligible employees may use (subject to availability\
  \ and some business limitations)\n 80 hours of sick time off provided on hire date\
  \ and each January 1st thereafter, and up to 80 hours of unused sick time carried\
  \ forward from one calendar year to the next\n Additional paid time away may be\
  \ requested to deal with critical or emergency issues for family members\n Optional\
  \ 10 paid days per full calendar year to volunteer\n For non-sales roles, employees\
  \ are also eligible to earn annual bonuses subject to Cisco’s policies. \n\n Employees\
  \ on sales plans earn performance-based incentive pay on top of their base salary,\
  \ which is split between quota and non-quota components, subject to the applicable\
  \ Cisco plan. For quota-based incentive pay, Cisco typically pays as follows: \n\
  \n\n\n .75% of incentive target for each 1% of revenue attainment up to 50% of quota;\n\
  \ 1.5% of incentive target for each 1% of attainment between 50% and 75%;\n 1% of\
  \ incentive target for each 1% of attainment between 75% and 100%; and\n Once performance\
  \ exceeds 100% attainment, incentive rates are at or above 1% for each 1% of attainment\
  \ with no cap on incentive compensation.\n For non-quota-based sales performance\
  \ elements such as strategic sales objectives, Cisco may pay 0% up to 125% of target.\
  \ Cisco sales plans do not have a minimum threshold of performance for sales incentive\
  \ compensation to be paid. \n\n The applicable full salary ranges for this position,\
  \ by specific state, are listed below: \n\n New York City Metro Area:\n $223,000.00\
  \ - $330,300.00 \n\n Non-Metro New York state& Washington state:\n $217,200.00 -\
  \ $315,300.00 \n\n\n For quota-based sales roles on Cisco’s sales plan, the ranges\
  \ provided in this posting include base pay and sales target incentive compensation\
  \ combined.\n ** Employees in Illinois, whether exempt or non-exempt, will participate\
  \ in a unique time off program to meet local requirements."
